server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # marimo's html-wasm export ships the full editor bundle plus the
    # Pyodide (Python-in-WASM) runtime -- tens of MB, mostly text-based
    # JS/JSON/wasm. Compressing it is the single biggest win for load time.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/wasm
        application/manifest+json
        font/woff2;

    # NOTE: deliberately not using a server-level `types {}` block here.
    # nginx's `types {}` directive *replaces* the inherited MIME map for
    # its context rather than extending it -- one was tried here and it
    # wiped out every other mapping (including html -> text/html),
    # which made the browser download index.html instead of rendering
    # it. nginx's stock mime.types already maps .wasm correctly; this
    # location just guarantees it without touching anything else.
    location ~* \.wasm$ {
        default_type application/wasm;
    }

    # The notebook's Python can't open a raw socket to Postgres from
    # inside Pyodide -- it calls this same-origin path instead, which
    # nginx forwards to api.py (bound to 127.0.0.1 only, never exposed
    # directly).
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Asset filenames are content-hashed by the bundler, so caching them
    # forever is safe -- only index.html needs to be revalidated. Matched
    # without a leading slash since with multiple notebooks each one's
    # assets live under its own subdirectory (e.g. /my-notebook/assets/),
    # not just at the site root.
    location ~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # marimo's WASM export resolves local-module wheels (session_state.py
    # -> ../public/wheels/*.whl) with a relative URL computed in the
    # browser, and it's not baked at build time -- so a wrong resolution
    # (e.g. one directory level off in a nested multi-notebook layout)
    # asks for a public/wheels/ path that doesn't exist there. Without
    # this location, that request falls through to `location /` below
    # and gets a 200 with index.html's *bytes* instead of a 404 --
    # micropip then fails trying to treat that HTML as a wheel, and the
    # resulting browser error ("Failed to fetch") gives no hint why.
    # A real 404 here at least fails honestly instead of silently.
    location ~ /public/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
