server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # marimo's html-wasm export ships the full editor bundle plus the
    # Pyodide (Python-in-WASM) runtime -- tens of MB, mostly text-based
    # JS/JSON/wasm. Compressing it is the single biggest win for load time.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/wasm
        application/manifest+json
        font/woff2;

    # NOTE: deliberately not using a server-level `types {}` block here.
    # nginx's `types {}` directive *replaces* the inherited MIME map for
    # its context rather than extending it -- one was tried here and it
    # wiped out every other mapping (including html -> text/html),
    # which made the browser download index.html instead of rendering
    # it. nginx's stock mime.types already maps .wasm correctly; this
    # location just guarantees it without touching anything else.
    location ~* \.wasm$ {
        default_type application/wasm;
    }

    # Asset filenames are content-hashed by the bundler, so caching them
    # forever is safe -- only index.html needs to be revalidated. Matched
    # without a leading slash since with multiple notebooks each one's
    # assets live under its own subdirectory (e.g. /my-notebook/assets/),
    # not just at the site root.
    location ~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
