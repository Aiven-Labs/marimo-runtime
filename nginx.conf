server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # marimo's html-wasm export ships the full editor bundle plus the
    # Pyodide (Python-in-WASM) runtime -- tens of MB, mostly text-based
    # JS/JSON/wasm. Compressing it is the single biggest win for load time.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/wasm
        application/manifest+json
        font/woff2;

    types {
        application/wasm wasm;
    }

    # Asset filenames are content-hashed by the bundler, so caching them
    # forever is safe -- only index.html needs to be revalidated.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
